name: Font packs

# A "fonts-N" tag builds the downloadable font packs and publishes them as
# that tag's release. The plugin checks every pack against the SHA-256 in
# src/font-pack-catalogue.ts, so this build must reproduce that catalogue
# exactly; if an upstream font has changed since, the job fails and nothing
# is published - rebuild the packs locally, commit the new catalogue and
# point FONT_PACKS_RELEASE_BASE at a new tag.
on:
  push:
    tags: ["fonts-*"]

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install fonttools==4.61.1 brotli==1.1.0
      - name: Build the packs
        run: python tools/build_font_packs.py --out dist/fonts --write-catalogue src/font-pack-catalogue.ts
      - name: The packs are the ones the plugin expects
        run: git diff --exit-code -- src/font-pack-catalogue.ts
      - name: The plugin downloads from this tag
        run: grep -q "releases/download/${GITHUB_REF_NAME}/" src/font-packs.ts
      # A pre-release: GitHub's "latest release", which the plugin's update
      # check reads, and BRAT, which reads a tag like "fonts-1" as version
      # 1.0.0, both pass over it.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "Font packs (${GITHUB_REF_NAME})" \
            --notes "Font packs for the Miro Canvas plugin, downloaded from Settings → Miro Canvas → Fonts. Only fonts under the SIL Open Font License, the Apache License or the MIT License; each pack carries its fonts' licences." \
            dist/fonts/*.zip
