name: Font packs

# A "fonts-0.0.N" tag builds the downloadable font packs and publishes them
# as that tag's release. The plugin checks every pack against the SHA-256 in
# src/font-pack-catalogue.ts, so this build must reproduce that catalogue
# exactly; if an upstream font has changed since, the job fails and nothing
# is published - rebuild the packs locally, commit the new catalogue and
# point FONT_PACKS_RELEASE_BASE at a new tag.
on:
  push:
    tags: ["fonts-*"]

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install fonttools==4.61.1 brotli==1.1.0
      # A run's log needs a sign-in; an annotation can be read without one.
      - name: Build the packs
        run: |
          if ! python tools/build_font_packs.py --out dist/fonts --write-catalogue src/font-pack-catalogue.ts 2> build-errors.txt; then
            echo "::error title=The packs did not build::$(tail -c 900 build-errors.txt | tr '\n' ' ')"
            exit 1
          fi
      - name: The packs are the ones the plugin expects
        run: |
          if ! git diff --quiet -- src/font-pack-catalogue.ts; then
            echo "::error title=The packs differ from the catalogue::$(git diff -U0 -- src/font-pack-catalogue.ts | grep -E '^[-+] +(file|bytes|sha256)' | tr '\n' ' ')"
            exit 1
          fi
      # BRAT reads a tag's first number as its version and, adding or
      # updating a plugin, tries pre-releases first: "fonts-2" read as 2.0.0
      # outranked the plugin and made BRAT report "no manifest.json". A tag
      # read as 0.0.N always ranks below the plugin's own releases.
      - name: The tag ranks below every plugin version
        run: echo "${GITHUB_REF_NAME}" | grep -Eq '^fonts-0\.0\.[0-9]+$'
      - name: The plugin downloads from this tag
        run: grep -q "releases/download/${GITHUB_REF_NAME}/" src/font-packs.ts
      # A pre-release: GitHub's "latest release", which the plugin's update
      # check reads, passes over it.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "Font packs (${GITHUB_REF_NAME})" \
            --notes "Font packs for the Miro Canvas plugin, downloaded from Settings → Miro Canvas → Fonts. Only fonts under the SIL Open Font License, the Apache License or the MIT License; each pack carries its fonts' licences." \
            dist/fonts/*.zip
